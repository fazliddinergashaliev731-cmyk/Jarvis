<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1724">
<title>Джарвис</title>
<style>
:root{--bg:#0b1724;--panel:#14263a;--line:#23405c;--text:#e6edf5;--dim:#8ea3b8;--gold:#f2b84b;--me:#1d4a73}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ring{width:34px;height:34px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 14px rgba(242,184,75,.5),inset 0 0 8px rgba(242,184,75,.4);flex:none}
.ring.busy{animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 24px rgba(242,184,75,.9),inset 0 0 14px rgba(242,184,75,.7)}}
@media (prefers-reduced-motion:reduce){.ring.busy{animation:none}}
header h1{font-size:18px;margin:0;flex:1}
header small{display:block;color:var(--dim);font-weight:400;font-size:12px}
.tog{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;font-size:13px}
.tog.on{color:var(--gold);border-color:var(--gold)}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.j{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.u{background:var(--me);align-self:flex-end;border-top-right-radius:4px}
#bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
#t{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:22px;padding:11px 16px;font:inherit;min-width:0}
#t:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.b{width:46px;height:46px;border-radius:50%;border:0;background:var(--panel);color:var(--text);font-size:20px;flex:none;border:1px solid var(--line)}
.b.go{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700}
.b.rec{background:#c0392b;border-color:#c0392b}
#login{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:28px;z-index:5}
#login h2{margin:0}
#login input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font:inherit}
#login button{background:var(--gold);color:#1a1200;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700}
</style>
</head>
<body>
<div id="login" hidden>
  <h2>Джарвис</h2>
  <p style="color:var(--dim);margin:0">Введи свой пароль (тот, что в JARVIS_PASSWORD).</p>
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
  <button id="pwgo">Войти</button>
</div>
<header>
  <div class="ring" id="ring"></div>
  <h1>Джарвис<small id="st">Я здесь. Что хотите спросить?</small></h1>
  <button class="tog on" id="vo">Голос: вкл</button>
</header>
<div id="log"></div>
<div id="bar">
  <button class="b" id="mic" aria-label="Говорить">🎤</button>
  <input id="t" placeholder="Напиши или нажми микрофон" autocomplete="off">
  <button class="b go" id="send" aria-label="Отправить">➤</button>
</div>
<script>
const URL_FN="https://krphkeevnrtkcnsqbxfo.supabase.co/functions/v1/jarvis-chat";
const $=id=>document.getElementById(id);
let pass="",hist=[],voiceOn=true,busy=false;
try{pass=localStorage.getItem("jv_pass")||"";hist=JSON.parse(localStorage.getItem("jv_hist")||"[]");voiceOn=localStorage.getItem("jv_voice")!=="0"}catch(_){}
function save(){try{localStorage.setItem("jv_hist",JSON.stringify(hist.slice(-30)))}catch(_){}}
function add(role,text){const d=document.createElement("div");d.className="m "+(role==="user"?"u":"j");d.textContent=text;$("log").appendChild(d);$("log").scrollTop=1e9}
function setVoice(){$("vo").textContent="Голос: "+(voiceOn?"вкл":"выкл");$("vo").classList.toggle("on",voiceOn);try{localStorage.setItem("jv_voice",voiceOn?"1":"0")}catch(_){}}
$("vo").onclick=()=>{voiceOn=!voiceOn;if(!voiceOn)speechSynthesis.cancel();setVoice()};
setVoice();
if(!pass)$("login").hidden=false;
$("pwgo").onclick=()=>{pass=$("pw").value.trim();if(!pass)return;try{localStorage.setItem("jv_pass",pass)}catch(_){}$("login").hidden=true};
hist.slice(-12).forEach(m=>add(m.role,m.content));
if(!hist.length)add("assistant","Я всегда здесь. Что хотите спросить?");

function speak(t){
  if(!voiceOn||!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[*#_`]/g,""));
  u.lang="ru-RU";speechSynthesis.speak(u);
}
async function ask(text){
  if(busy||!text)return;
  busy=true;add("user",text);hist.push({role:"user",content:text});
  $("ring").classList.add("busy");$("st").textContent="Думаю…";
  let reply;
  try{
    const r=await fetch(URL_FN,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:hist.slice(-20),pass})});
    const d=await r.json();
    reply=d.reply||"Пустой ответ";
    if(r.status===401){pass="";try{localStorage.removeItem("jv_pass")}catch(_){}$("login").hidden=false}
    else if(r.ok){hist.push({role:"assistant",content:reply});save()}
    else hist.pop();
  }catch(_){reply="Нет связи. Проверь интернет и попробуй ещё раз.";hist.pop()}
  add("assistant",reply);speak(reply);
  $("ring").classList.remove("busy");$("st").textContent="Я здесь. Что хотите спросить?";busy=false;
}
function send(){const v=$("t").value.trim();$("t").value="";ask(v)}
$("send").onclick=send;
$("t").addEventListener("keydown",e=>{if(e.key==="Enter")send()});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
$("mic").onclick=()=>{
  if(!SR){add("assistant","Этот браузер не умеет распознавать голос. Открой страницу в Chrome.");return}
  if(listening){rec.stop();return}
  speechSynthesis.cancel();
  rec=new SR();rec.lang="ru-RU";rec.interimResults=false;
  rec.onstart=()=>{listening=true;$("mic").classList.add("rec");$("st").textContent="Слушаю…"};
  rec.onend=()=>{listening=false;$("mic").classList.remove("rec");if(!busy)$("st").textContent="Я здесь. Что хотите спросить?"};
  rec.onerror=()=>{listening=false;$("mic").classList.remove("rec")};
  rec.onresult=e=>ask(e.results[0][0].transcript);
  rec.start();
};
</script>
</body>
</html>
